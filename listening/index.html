<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKP IELTS — Listening</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--brand:#2563eb;--brand2:#1d4ed8;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--shadow:0 8px 28px rgba(16,24,40,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}.brand{font-weight:800;white-space:nowrap}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}.btn:active{transform:translateY(1px)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px 80px}.hero{background:linear-gradient(135deg,#fff,#eef4ff);border:1px solid #dbe5ff;border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:clamp(22px,4vw,32px)}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.testcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.testcard h3{margin:0 0 7px}.testcard p{margin:0 0 14px;color:var(--muted);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
.examHead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}.examTitle{font-weight:800;font-size:20px;margin-bottom:10px}.parts{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.partBtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer}.partBtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.audioBox{position:sticky;top:59px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}.audioBox .label{font-size:12px;color:var(--muted);margin-bottom:4px}.audioBox audio{width:100%}
.paper{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(15px,3vw,28px);box-shadow:var(--shadow);line-height:1.6}.paper .heading{font-weight:800;font-size:18px;margin:18px 0 8px}.paper .heading:first-child{margin-top:0}.paper .instruction{font-weight:650;margin:3px 0;color:#344054}.paper .textline{margin:7px 0}.paper .qline{margin:8px 0}.paper .spacer{height:8px}.paper .qnum{display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:25px;margin:0 3px;font-weight:800;color:#111827;background:#f1f5f9;border-radius:6px;vertical-align:middle}.inline-input{width:145px;max-width:42vw;border:0;border-bottom:2px solid #64748b;background:#fff;padding:2px 5px;outline:none;color:#111827}.inline-input:focus{border-bottom-color:var(--brand);background:#eff6ff}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0 4px}.opt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:5px 9px;background:#fafafa;cursor:pointer}.option-static{margin:4px 0 4px 10px}.paper input[type=radio],.paper input[type=checkbox]{accent-color:var(--brand)}
.paper .matching{display:inline-flex;align-items:center;min-width:145px;border:1px dashed #94a3b8;border-radius:8px;padding:4px 7px;margin:0 4px;background:#f8fafc}.paper select{border:1px solid #94a3b8;border-radius:8px;padding:5px;background:#fff}.paper textarea{width:100%;min-height:90px}
.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:14px 0}.actions .right{margin-left:auto}.status{font-size:13px;color:var(--muted)}
.resultHero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);text-align:center}.score{font-size:48px;font-weight:900;line-height:1}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafafa}.stat b{display:block;font-size:23px}.review{margin-top:14px}.reviewCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:9px 0}.reviewCard.ok{border-left:5px solid var(--ok)}.reviewCard.bad{border-left:5px solid var(--bad)}.reviewCard.skip{border-left:5px solid var(--warn)}.reviewTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.badge.skip{background:#fef3c7;color:#92400e}.answer{margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:9px}.transcript{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px;overflow:auto;line-height:1.55}.reviewTabs{position:sticky;top:59px;z-index:19;background:rgba(245,247,251,.96);padding:8px 0;display:flex;gap:6px;overflow:auto}.reviewTab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer}.reviewTab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(max-width:650px){.topin{padding:8px 10px}.wrap{padding:12px 9px 70px}.statgrid{grid-template-columns:repeat(2,1fr)}.examTitle{font-size:17px}.inline-input{width:120px}.audioBox{top:52px}.reviewTabs{top:52px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><button class="btn" id="homeBtn">← Home</button><div class="brand">🎧 SKP IELTS Listening</div><div class="spacer"></div><button class="btn" id="focusBtn">⛶ Focus</button></div></header>
<main class="wrap"><div id="app"></div></main>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const DATA=window.LISTENING_DATA||[]; const app=document.getElementById('app');
const S={screen:'library',test:null,part:1,startedAt:0,answers:{},reviewPart:1};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function testById(id){return DATA.find(t=>String(t.id)===String(id));}
function key(q){return 'q'+q}
function setAnswer(q,val){S.answers[key(q)]=val;}
function getAnswer(q){return S.answers[key(q)]??''}
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function accepted(q){let a=S.test.answers?.[q]; if(!Array.isArray(a)) a=[a]; return a.filter(x=>x!=null).map(norm)}
function isCorrect(q){const good=accepted(q); const v=getAnswer(q); if(Array.isArray(v)) return good.length===v.map(norm).filter(Boolean).sort().join('|') && good.slice().sort().join('|')===v.map(norm).filter(Boolean).sort().join('|'); return good.includes(norm(v));}
function answered(q){const v=getAnswer(q); return Array.isArray(v)?v.filter(Boolean).length>0:String(v??'').trim()!==''}
function bandFor(raw){
 const n=raw; if(n>=39)return 9; if(n>=37)return 8.5; if(n>=35)return 8; if(n>=32)return 7.5; if(n>=30)return 7; if(n>=26)return 6.5; if(n>=23)return 6; if(n>=18)return 5.5; if(n>=16)return 5; if(n>=13)return 4.5; if(n>=10)return 4; if(n>=8)return 3.5; if(n>=6)return 3; if(n>=4)return 2.5; if(n>=2)return 2; if(n>=1)return 1; return 0;
}
function allQs(){return Array.from({length:40},(_,i)=>i+1)}
function sectionOf(q){return q<=10?1:q<=20?2:q<=30?3:4}
function saveInputs(root){
 $$('[data-q]',root).forEach(el=>{
   const q=Number(el.dataset.q); if(!q)return;
   if(el.type==='radio'){if(el.checked)setAnswer(q,el.value)}
   else if(el.type==='checkbox'){
      let arr=Array.isArray(getAnswer(q))?getAnswer(q):[]; if(el.checked&&!arr.includes(el.value))arr.push(el.value); if(!el.checked)arr=arr.filter(x=>x!==el.value); setAnswer(q,arr)
   } else if(el.tagName==='SELECT'){setAnswer(q,el.value)}
   else setAnswer(q,el.value);
 });
}
function restoreInputs(root){
 $$('[data-q]',root).forEach(el=>{const q=Number(el.dataset.q),v=getAnswer(q); if(el.type==='radio')el.checked=String(v)===String(el.value); else if(el.type==='checkbox')el.checked=Array.isArray(v)&&v.includes(el.value); else el.value=Array.isArray(v)?v.join(', '):v});
}
function bindInputs(root){
 $$('[data-q]',root).forEach(el=>{el.addEventListener('input',()=>saveInputs(root));el.addEventListener('change',()=>saveInputs(root));});
}
function audioSrc(t,p){let src=t.audio?.[p-1]||''; if(!src)return ''; return src;}
function renderLibrary(){
 S.screen='library';
 app.innerHTML=`<section class="hero"><h1>IELTS Listening Tests</h1><p>${DATA.length} practice tests • Start a full test or practise a single section.</p></section><div class="grid">${DATA.map(t=>`<article class="testcard"><h3>Listening Test ${esc(t.id)}</h3><p>${esc(t.title||'IELTS Listening Practice Test '+t.id)}</p><div class="row"><button class="btn primary" data-start="${esc(t.id)}">Start Test</button><button class="btn" data-practice="${esc(t.id)}">Practice Section</button></div></article>`).join('')}</div>`;
 $$('[data-start]').forEach(b=>b.onclick=()=>start(Number(b.dataset.start),1,false)); $$('[data-practice]').forEach(b=>b.onclick=()=>choosePractice(Number(b.dataset.practice)));
}
function choosePractice(id){const t=testById(id); app.innerHTML=`<section class="hero"><h1>Listening Test ${esc(t.id)}</h1><p>Choose a section to practise.</p><div class="row" style="margin-top:14px">${[1,2,3,4].map(p=>`<button class="btn primary" data-p="${p}">Part ${p}</button>`).join('')}<button class="btn" id="backLib">Cancel</button></div></section>`; $$('[data-p]').forEach(b=>b.onclick=()=>start(id,Number(b.dataset.p),true)); $('#backLib').onclick=renderLibrary}
function start(id,part=1,practice=false){
 const t=testById(id); if(!t)return; S.test=t; S.part=part; S.practice=practice; S.startedAt=Date.now(); S.answers={}; S.screen='test'; renderTest();
}
function renderTest(){
 const t=S.test,p=S.part; const html=t.renderedSections?.[p-1]||`<p>No section content available.</p>`;
 app.innerHTML=`<section class="examHead"><div class="examTitle">${esc(t.title||'IELTS Listening Test '+t.id)}</div><div class="parts">${[1,2,3,4].map(x=>`<button class="partBtn ${x===p?'active':''}" data-part="${x}">Part ${x}</button>`).join('')}</div></section>
 <div class="audioBox"><div class="label">Part ${p} audio</div><audio id="player" controls preload="metadata" src="${esc(audioSrc(t,p))}"></audio></div>
 <section class="paper" id="paper">${html}</section>
 <div class="actions"><span class="status">You can move between Parts 1–4 at any time.</span><div class="right"><button class="btn danger" id="submitBtn">Submit Test</button></div></div>`;
 const paper=$('#paper'); restoreInputs(paper); bindInputs(paper);
 $$('[data-part]').forEach(b=>b.onclick=()=>switchPart(Number(b.dataset.part)));
 $('#submitBtn').onclick=submit;
 const player=$('#player'); player.addEventListener('error',()=>{});
}
function switchPart(next){saveInputs($('#paper')); if(next===S.part)return; const old=$('#player'); const time=old?old.currentTime:0,was=old?!old.paused:false; S.part=next; renderTest(); const p=$('#player'); if(p){p.currentTime=time; if(was)p.play().catch(()=>{});} window.scrollTo({top:0,behavior:'smooth'});}
function submit(){
 saveInputs($('#paper')); const qs=allQs(); let correct=0,wrong=0,unanswered=0; qs.forEach(q=>{if(!answered(q))unanswered++;else if(isCorrect(q))correct++;else wrong++});
 S.result={correct,wrong,unanswered,total:40,band:bandFor(correct)}; S.screen='result'; renderResult();
}
function renderResult(){
 const r=S.result,t=S.test; app.innerHTML=`<section class="resultHero"><div style="color:var(--muted);font-weight:700">Listening Test ${esc(t.id)} complete</div><div class="score">Band ${r.band}</div><div class="statgrid"><div class="stat"><b>${r.correct}</b>Correct</div><div class="stat"><b>${r.wrong}</b>Wrong</div><div class="stat"><b>${r.unanswered}</b>Unanswered</div><div class="stat"><b>40</b>Total</div></div><div class="row" style="justify-content:center"><button class="btn primary" id="reviewBtn">Test Review</button><button class="btn" id="retakeBtn">Retake Test</button><button class="btn" id="home2">All Tests</button></div></section><div class="review hidden" id="review"></div>`;
 $('#reviewBtn').onclick=()=>renderReview(1); $('#retakeBtn').onclick=()=>start(t.id,1,false); $('#home2').onclick=renderLibrary;
}
function renderReview(part){
 S.reviewPart=part; const box=$('#review'); if(!box){return} box.classList.remove('hidden'); const t=S.test;
 const nums=allQs().filter(q=>sectionOf(q)===part);
 box.innerHTML=`<div class="reviewTabs">${[1,2,3,4].map(p=>`<button class="reviewTab ${p===part?'active':''}" data-rp="${p}">Part ${p} · ${p*10-9}–${p*10}</button>`).join('')}</div><div><h2>Test Review — Part ${part}</h2>${nums.map(q=>{const ok=isCorrect(q),ans=getAnswer(q),correct=t.answers?.[q]||[];let cls=!answered(q)?'skip':ok?'ok':'bad';let label=!answered(q)?'Unanswered':ok?'Correct':'Wrong';let your=Array.isArray(ans)?ans.filter(Boolean).join(', '):ans;let corr=Array.isArray(correct)?correct.join(' / '):correct;return `<article class="reviewCard ${cls}" id="rq${q}"><div class="reviewTop"><b>Question ${q}</b><span class="badge ${cls}">${label}</span></div><div class="answer"><b>Your answer:</b> ${esc(your||'—')}<br><b>Correct answer:</b> ${esc(corr||'—')}</div></article>`}).join('')}</div><details style="margin-top:14px"><summary><b>Show Part ${part} transcript</b></summary><div class="transcript">${esc(t.transcriptText?.[part-1]||'No transcript available.')}</div></details>`;
 $$('[data-rp]').forEach(b=>b.onclick=()=>renderReview(Number(b.dataset.rp)));
 window.scrollTo({top:0,behavior:'smooth'});
}
$('#homeBtn').onclick=()=>{S.test=null;S.screen='library';renderLibrary()};
$('#focusBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
renderLibrary();
})();
</script>
</body>
</html>
