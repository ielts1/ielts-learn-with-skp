<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Learn With SKP</title><style>
:root{--blue:#0e4963;--green:#16a66a;--bg:#f4f7f9;--line:#e4e7ec;--muted:#667085;--card:#fff;--danger:#d92d20}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#101828}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}.bar{display:flex;align-items:center;gap:10px;max-width:1250px;margin:auto}.bar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.title{flex:1}.title b{display:block}.title small{color:var(--muted)}.timer{font-weight:900;color:var(--blue)}main{max-width:1250px;margin:auto;padding:14px}.home h1{margin:12px 0 4px}.muted{color:var(--muted)}.library{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.test{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px}.num{width:44px;height:44px;border-radius:12px;background:#eaf6fb;color:var(--blue);display:grid;place-items:center;font-weight:900}.info{flex:1}.info b{display:block}.info small{color:var(--muted)}.start,.submit{border:0;background:#101828;color:#fff;border-radius:10px;padding:10px 13px;font-weight:900}.sections{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.sections button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:900}.sections .active{background:var(--blue);color:#fff}.audio{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}.audio audio{width:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}.paper,.answers,.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.paper h2{font-size:17px;margin:0 0 12px}.paperline{margin:4px 0;line-height:1.55}.instruction{font-weight:800;margin:8px 0}.paperhead{font-weight:900;font-size:17px;margin:14px 0 5px}.optionline{margin:2px 0 2px 16px}.qgroup-title{font-weight:900;margin-top:14px}.blank{display:inline-block;border-bottom:2px solid #344054;min-width:55px;color:transparent}.answers{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}.nav{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 14px}.nav button{width:31px;height:31px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:900}.nav button.done{background:#ecfdf3;border-color:#a7e6c5;color:#067647}.qrow{border-top:1px solid #eef0f2;padding:11px 0}.qrow:first-child{border-top:0}.qnum{font-weight:900;color:var(--blue);margin-right:6px}.qhint{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}.text{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px}.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:8px 11px;font-weight:800}.opt.sel{background:#eaf6fb;border-color:#80b8cb;color:var(--blue)}.select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.multi-note{font-size:11px;color:var(--muted);margin-top:6px}.submit{width:100%;background:var(--green);margin-top:12px}.clear{width:100%;margin-top:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:800}.result{margin-top:14px}.score{font-size:34px;font-weight:900;color:var(--blue)}.reviewrow{padding:9px 0;border-top:1px solid var(--line)}.good{color:#067647}.bad{color:#b42318}.transcript{white-space:pre-wrap;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:900}@media(max-width:900px){.library{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.answers{position:relative;top:auto;max-height:none}.paper{order:1}.answers{order:2}}@media(max-width:520px){main{padding:9px}.test{padding:12px}.start{padding:9px}.title b{font-size:13px}}
</style></head><body><header class="top"><div class="bar"><button class="back" onclick="home()">⌂</button><div class="title"><b id="topTitle">IELTS Listening</b><small id="topSub">31 interactive tests</small></div><span class="timer" id="timer">00:00</span></div></header><main id="app"></main><script src="data.js"></script><script>
const DATA=window.LISTENING_DATA||[];let state={test:null,section:1,answers:{},timer:0,interval:null,submitted:false};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){clearInterval(state.interval);state.test=null;location.hash='';$('#topTitle').textContent='IELTS Listening';$('#topSub').textContent='31 interactive tests';$('#timer').textContent='00:00';$('#app').innerHTML='<section class="home"><h1>IELTS Listening</h1><p class="muted">Choose a test. Questions are shown as readable text with interactive answer controls — not just page images.</p><div class="library">'+DATA.map(t=>`<article class="test"><div class="num">${String(t.id).padStart(2,'0')}</div><div class="info"><b>${esc(t.title)}</b><small>4 sections · 40 questions</small></div><button class="start" onclick="openTest(${t.id})">START</button></article>`).join('')+'</div></section>'}
function gFor(q){return state.test.groups.find(g=>g.numbers.includes(q))||{type:'text',numbers:[q],options:[],section:1}}
function keyFor(g){return 'g'+g.numbers.join('_')}
function done(q){let g=gFor(q),v=(g.type==='multi2'||g.type==='multi3')?state.answers[keyFor(g)]:state.answers[q];return Array.isArray(v)?v.length>0:!!String(v??'').trim()}
function nav(){return '<div class="nav">'+Array.from({length:40},(_,i)=>i+1).map(q=>`<button class="${done(q)?'done':''}" onclick="document.getElementById('q${q}')?.scrollIntoView({behavior:'smooth',block:'center'})">${q}</button>`).join('')+'</div>'}
function control(q,g){let v=state.answers[q]||'';if(g.type==='single_choice'){let opts=g.options.length?g.options:['A','B','C'];return `<div class="opts">${opts.map(o=>`<button class="opt ${v===o?'sel':''}" onclick="pick(${q},'${o}')">${o}</button>`).join('')}</div>`}
if(g.type==='multi2'||g.type==='multi3'){let n=g.type==='multi2'?2:3,k=keyFor(g),arr=Array.isArray(state.answers[k])?state.answers[k]:[],opts=g.options.length?g.options:['A','B','C','D','E','F','G','H'];return `<div class="opts">${opts.map(o=>`<button class="opt ${arr.includes(o)?'sel':''}" onclick="multi('${k}','${o}',${n})">${o}</button>`).join('')}</div><div class="multi-note">Choose ${n} answers for Questions ${g.numbers.join('–')}.</div>`}
if(g.type==='matching'&&g.options.length){return `<select class="select" onchange="state.answers[${q}]=this.value;refresh()"><option value="">Select answer</option>${g.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`}
return `<input class="text" value="${esc(v)}" placeholder="Type your answer" oninput="state.answers[${q}]=this.value;markNav()">`}
function qrows(sec){let html='';for(let q=1;q<=40;q++){let g=gFor(q);if(g.section!==sec)continue;if(g.type==='multi2'||g.type==='multi3'){if(q!==g.numbers[0])continue;html+=`<div class="qrow" id="q${q}"><span class="qnum">Questions ${g.numbers[0]}–${g.numbers[g.numbers.length-1]}</span><span class="qhint">${g.type==='multi2'?'Choose TWO':'Choose THREE'}</span>${control(q,g)}</div>`}else html+=`<div class="qrow" id="q${q}"><span class="qnum">${q}.</span><span class="qhint">${g.type==='single_choice'?'Choose one letter':g.type==='matching'?'Matching / label':'Written answer'}</span>${control(q,g)}</div>`}return html}
function openTest(id){clearInterval(state.interval);state.test=DATA.find(t=>t.id===id);state.section=1;state.answers={};state.timer=0;state.submitted=false;state.interval=setInterval(()=>{state.timer++;let m=Math.floor(state.timer/60),s=state.timer%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')},1000);location.hash='test-'+id;render()}
function render(){let t=state.test;$('#topTitle').textContent=t.title;$('#topSub').textContent='Section '+state.section+' · 40 questions';let paper=t.paperSections[String(state.section)]||'';$('#app').innerHTML=`<div class="sections">${[1,2,3,4].map(s=>`<button class="${s===state.section?'active':''}" onclick="changeSec(${s})">Section ${s}</button>`).join('')}</div><div class="audio"><b>🎧 Section ${state.section} Audio</b><audio controls preload="metadata" src="audio/Test ${String(t.id).padStart(2,'0')} - Section ${state.section}.mp3"></audio></div><div class="layout"><section class="paper"><h2>Question Paper — Section ${state.section}</h2><div>${paper}</div></section><aside class="answers"><b>Answer Sheet</b>${nav()}${qrows(state.section)}<button class="submit" onclick="submit()">SUBMIT TEST</button><button class="clear" onclick="clearAns()">Clear answers</button></aside></div><div id="result"></div>`}
function changeSec(s){state.section=s;render();scrollTo(0,0)}function pick(q,o){state.answers[q]=o;render()}function multi(k,o,n){let a=Array.isArray(state.answers[k])?state.answers[k].slice():[];if(a.includes(o))a=a.filter(x=>x!==o);else if(a.length<n)a.push(o);state.answers[k]=a;render()}function refresh(){render()}function markNav(){}
function norm(x){return String(x??'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim().replace(/^[.,;:!?]+|[.,;:!?]+$/g,'')}
function acceptable(v,arr){return arr.some(a=>norm(v)===norm(a))}
function isCorrect(q){let g=gFor(q), target=state.test.answers[String(q)]||[];if(g.type==='multi2'||g.type==='multi3'){let u=state.answers[keyFor(g)]||[];return Array.isArray(u)&&u.map(norm).sort().join('|')===target.map(norm).sort().join('|')}return acceptable(state.answers[q],target)}
function band(c){if(c>=39)return 9;if(c>=37)return 8.5;if(c>=35)return 8;if(c>=32)return 7.5;if(c>=30)return 7;if(c>=26)return 6.5;if(c>=23)return 6;if(c>=18)return 5.5;if(c>=16)return 5;if(c>=13)return 4.5;if(c>=11)return 4;return 3.5}
function submit(){clearInterval(state.interval);let c=0,rows='';for(let q=1;q<=40;q++){let ok=isCorrect(q);if(ok)c++;let g=gFor(q),u=(g.type==='multi2'||g.type==='multi3')?(state.answers[keyFor(g)]||[]).join(', '):(state.answers[q]||'—'),a=(state.test.answers[String(q)]||[]).join(' / ');rows+=`<div class="reviewrow ${ok?'good':'bad'}"><b>${q}. ${ok?'Correct':'Review'}</b> — Your answer: ${esc(u)} · Correct: ${esc(a||'—')}</div>`}$('#result').innerHTML=`<section class="result"><h2>Result</h2><div class="score">${c} / 40</div><p>Practice band estimate: <b>${band(c)}</b></p>${rows}<div class="transcript"><h3>Tapescript</h3>${esc(state.test.transcriptText||'')}</div></section>`;scrollTo(0,document.body.scrollHeight)}
function clearAns(){if(confirm('Clear all answers?')){state.answers={};render()}}
home();if(location.hash.startsWith('#test-')){let id=Number(location.hash.slice(6));if(id)openTest(id)}
</script></body></html>
