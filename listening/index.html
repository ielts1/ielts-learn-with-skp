<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b4963"><title>IELTS Listening — SKP</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#17212b;--muted:#697781;--line:#dfe6ea;--blue:#0b4963;--green:#18a96b;--red:#c43a3a;--soft:#edf9f3;--shadow:0 8px 26px rgba(16,36,48,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px;padding:9px 12px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.brand{flex:1;min-width:0}.brand b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand small{color:var(--muted)}.timer{font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}main{max-width:1180px;margin:auto;padding:15px 12px 150px}.hero{padding:8px 2px 15px}.hero h1{font-size:27px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:10px 0 14px}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow)}.num{width:44px;height:44px;border-radius:12px;background:#e9f5f9;color:var(--blue);display:grid;place-items:center;font-weight:900}.info{flex:1;min-width:0}.info b{display:block}.info small{color:var(--muted)}.start{border:0;background:#17212b;color:#fff;border-radius:10px;padding:10px 12px;font-weight:900}.parts{display:flex;gap:7px;overflow:auto;padding:7px 0 10px;position:sticky;top:58px;background:rgba(243,246,248,.96);z-index:50}.parts button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:900}.parts button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.audio{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:var(--shadow);position:sticky;top:108px;z-index:45;margin-bottom:12px}.audiohead{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.audiohead b{font-size:14px}.audiohead span{font-size:11px;color:var(--muted)}audio{width:100%;height:40px}.paper{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:17px;line-height:1.55}.paper-title{font-size:20px;font-weight:900;margin-bottom:8px}.section-title{font-size:18px;font-weight:900;margin:18px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}.heading{font-weight:900;margin:15px 0 7px}.instruction{font-weight:700;color:#394751;margin:6px 0}.textline{margin:5px 0;white-space:normal}.qline{margin:8px 0}.qnum{display:inline-grid;place-items:center;min-width:27px;height:27px;border-radius:7px;background:#edf1f3;font-weight:900;margin-right:6px;vertical-align:middle}.inline-input{display:inline-block;width:145px;max-width:42vw;height:31px;border:2px solid #aebbc2;border-radius:7px;background:#fff;margin:0 3px;padding:3px 7px;vertical-align:middle;outline:none}.inline-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(24,169,107,.13)}.choices{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0 4px 33px}.opt{border:1px solid var(--line);background:#f9fbfc;border-radius:8px;padding:6px 9px;font-size:14px}.opt input{accent-color:var(--green);margin-right:5px}.option-static{margin:3px 0 3px 20px}.spacer{height:7px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 25px rgba(16,36,48,.08)}.navin{max-width:1180px;margin:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.navtop{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin-bottom:5px}.navtop span{color:var(--muted)}.qnav{display:grid;grid-template-columns:repeat(40,1fr);gap:3px}.qnav button{border:1px solid var(--line);background:#fff;border-radius:6px;height:28px;font-size:10px;font-weight:900}.qnav button.done{background:var(--soft);border-color:#a7ddc2;color:#087044}.qnav button.current{outline:2px solid var(--blue)}.navactions{display:flex;gap:7px;margin-top:7px}.navactions button{flex:1;border:0;border-radius:9px;padding:9px;font-weight:900}.prevnext{background:#17212b;color:#fff}.submit{background:var(--green);color:#fff}.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.score{font-size:43px;font-weight:900;color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#f6f8f9;border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.review{padding:10px 0;border-top:1px solid var(--line)}.good{color:#087044}.bad{color:var(--red)}.correct{color:#087044;margin-top:3px}.transcript{white-space:pre-wrap;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:430px;overflow:auto;font-size:13px}@media(max-width:700px){.library{grid-template-columns:1fr}.qnav{grid-template-columns:repeat(20,1fr)}.paper{padding:13px}.audio{top:106px}.inline-input{width:130px}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){main{padding-left:7px;padding-right:7px}.qnav{grid-template-columns:repeat(10,1fr)}.qnav button{height:27px}.inline-input{width:118px}.choices{margin-left:0}.brand small{display:none}}
</style></head><body>
<header class="top"><div class="topin"><button class="btn" id="homeBtn">⌂</button><div class="brand"><b id="title">IELTS Listening</b><small id="sub">31 practice tests</small></div><span class="timer" id="timer">00:00</span><button class="btn" id="fullBtn">⛶</button></div></header>
<main id="app"></main><div class="nav hidden" id="nav"><div class="navin"><div class="navtop"><b>Questions 1–40</b><span id="answered">0/40 answered</span></div><div id="qnav" class="qnav"></div><div class="navactions"><button id="prev" class="prevnext">← Previous</button><button id="submit" class="submit">Submit Test</button><button id="next" class="prevnext">Next →</button></div></div></div>
<script src="data.js"></script><script>
const DATA=window.LISTENING_DATA||[];const $=id=>document.getElementById(id);let S={test:null,part:1,answers:{},submitted:false,seconds:0,timer:null};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').toLowerCase().replace(/[.,;:!?()[\]{}£$%]/g,' ').replace(/\s+/g,' ').trim()}
function sec(q){return Math.floor((q-1)/10)+1}function group(q){return S.test.groups.find(g=>g.numbers.includes(q))||{type:'text',numbers:[q],options:[]}}function ans(q){return S.test.answers[String(q)]||[]}
function isCorrect(q){let g=group(q),v=S.answers[q];if(g.type==='multi2'||g.type==='multi3'){let got=(Array.isArray(v)?v:[v]).filter(Boolean).map(x=>String(x).toUpperCase()).sort();let want=ans(q).map(x=>String(x).toUpperCase()).sort();return got.length===want.length&&got.every((x,i)=>x===want[i])}return ans(q).map(norm).includes(norm(v))}
function answered(q){let v=S.answers[q];return Array.isArray(v)?v.some(Boolean):String(v??'').trim()!==''}
function home(){stop();S.test=null;$('nav').classList.add('hidden');$('title').textContent='IELTS Listening';$('sub').textContent='31 practice tests';$('timer').textContent='00:00';$('app').innerHTML='<section class="hero"><h1>🎧 IELTS Listening</h1><p>31 complete Listening practice tests with typed questions, section audio, navigation, scoring and answer review.</p><input id="search" class="search" placeholder="Search Test 01–31..."><div id="library" class="library"></div></section>';renderLibrary();$('search').oninput=renderLibrary}
function renderLibrary(){let t=norm($('search')?.value||'');let arr=DATA.filter(x=>!t||String(x.id).includes(t)||norm(x.title).includes(t));$('library').innerHTML=arr.map(x=>'<article class="card"><div class="num">'+String(x.id).padStart(2,'0')+'</div><div class="info"><b>'+esc(x.title)+'</b><small>40 questions · 4 parts</small></div><button class="start" onclick="start('+x.id+')">Start Test</button></article>').join('')}
function start(id){S.test=DATA.find(x=>x.id===id);S.part=1;S.answers={};S.submitted=false;S.seconds=0;runTimer();$('title').textContent=S.test.title;$('sub').textContent='40 questions · 4 parts';$('nav').classList.remove('hidden');render();updateNav();window.scrollTo(0,0)}
function runTimer(){stop();S.timer=setInterval(()=>{S.seconds++;let h=Math.floor(S.seconds/3600),m=Math.floor(S.seconds%3600/60),s=S.seconds%60;$('timer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':')},1000)}function stop(){if(S.timer)clearInterval(S.timer);S.timer=null}
function setAnswer(q,v){if(group(q).type==='multi2'||group(q).type==='multi3'){S.answers[q]=Array.isArray(v)?v:[v]}else S.answers[q]=v;updateNav()}
function render(){let t=S.test,html='<div class="hero"><h1>'+esc(t.title)+'</h1><p>Part '+S.part+' · Questions '+((S.part-1)*10+1)+'–'+(S.part*10)+'</p></div><div class="parts">'+[1,2,3,4].map(i=>'<button class="'+(i===S.part?'active':'')+'" onclick="part('+i+')">Part '+i+' · '+((i-1)*10+1)+'–'+i*10+'</button>').join('')+'</div><section class="audio"><div class="audiohead"><b>🎧 Part '+S.part+' audio</b><span>Answer while listening — typing will not reload the audio.</span></div><audio id="player" controls preload="metadata" src="'+esc(t.audio[S.part-1])+'"></audio></section><section class="paper"><div class="paper-title">Questions '+((S.part-1)*10+1)+'–'+(S.part*10)+'</div>'+t.renderedSections[S.part-1]+'</section>';$('app').innerHTML=html;bindInputs()}
function bindInputs(){document.querySelectorAll('[data-q]').forEach(el=>{let q=+el.dataset.q;if(el.type==='radio'||el.type==='checkbox'){let v=S.answers[q]||[];if(!Array.isArray(v))v=[v];el.checked=v.includes(el.value);el.onchange=()=>{let a=Array.isArray(S.answers[q])?S.answers[q].slice():[];if(el.checked){if(!a.includes(el.value))a.push(el.value)}else a=a.filter(x=>x!==el.value);setAnswer(q,a)}}else{el.value=S.answers[q]||'';el.oninput=()=>setAnswer(q,el.value)}})}
function part(p){S.part=p;render();window.scrollTo(0,0)}function jump(q){let p=sec(q);if(p!==S.part){S.part=p;render()}setTimeout(()=>{let el=document.querySelector('[data-q="'+q+'"]');el?.scrollIntoView({behavior:'smooth',block:'center'})},50)}
function updateNav(){if(!S.test)return;$('qnav').innerHTML='';let n=0;for(let q=1;q<=40;q++){if(answered(q))n++;let b=document.createElement('button');b.textContent=q;b.className=(answered(q)?'done ':'')+(sec(q)===S.part?'current':'');b.onclick=()=>jump(q);$('qnav').appendChild(b)}$('answered').textContent=n+'/40 answered'}
function submit(){stop();S.submitted=true;let correct=0,rows=[];for(let q=1;q<=40;q++){let ok=isCorrect(q);if(ok)correct++;rows.push({q,ok,user:S.answers[q],right:ans(q)})}let pct=correct/40,band=pct>=.875?8.5:pct>=.75?7.5:pct>=.625?6.5:pct>=.5?5.5:pct>=.4?5:pct>=.3?4.5:4;$('app').innerHTML='<section class="result"><h1>Listening Test Result</h1><div class="score">'+correct+'/40</div><div class="stats"><div class="stat"><b>'+correct+'</b><span>Correct</span></div><div class="stat"><b>'+(40-correct)+'</b><span>Wrong / unanswered</span></div><div class="stat"><b>'+band+'</b><span>Practice band estimate</span></div></div><button class="btn" onclick="start('+S.test.id+')">Retake Test</button><div>'+rows.map(r=>'<div class="review"><b class="'+(r.ok?'good':'bad')+'">Question '+r.q+': '+(r.ok?'✓ Correct':'✗ Incorrect')+'</b><div>Your answer: '+esc(Array.isArray(r.user)?r.user.join(', '):r.user||'—')+'</div><div class="correct">Correct answer: '+esc(r.right.join(' / '))+'</div></div>').join('')+'</div><details><summary><b>Show tapescript</b></summary><div class="transcript">'+esc(S.test.transcriptText)+'</div></details></section>';updateNav();window.scrollTo(0,0)}
$('homeBtn').onclick=home;$('submit').onclick=submit;$('prev').onclick=()=>jump(Math.max(1,S.part*10-9));$('next').onclick=()=>jump(Math.min(40,S.part*10+1));$('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();home();
</script></body></html>
